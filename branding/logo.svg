<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100">
  <!-- The Polaron horizontal logo, DARK-ground variant. Use logo-light.svg on white/light grounds.
       -->
  <!-- THE MARK IS A LATTICE WITH ONE THING WRONG WITH IT.
       A polaron is a real object in physics: a charge carrier moving through a crystal lattice,
       dragging with it the distortion it causes. Carrier and cloud, treated as one thing. So the
       mark is nine points -- a heavy core, four near neighbours pulled IN toward it on the
       diagonals, and four further out on the axes still where the lattice put them. Near bends, far
       does not, and the displacement is read from that rhythm rather than from any before-and-after.

       The rings are told apart by SIZE, never by opacity. A mark that leans on transparency dies the
       first time it is punched into an .ico, stencilled into one colour, or printed. -->
  <g transform="translate(6,6) scale(1.375)">
    <g fill="#5a80ec">
      <circle cx="23.1" cy="23.1" r="3.1"/><circle cx="40.9" cy="23.1" r="3.1"/>
      <circle cx="23.1" cy="40.9" r="3.1"/><circle cx="40.9" cy="40.9" r="3.1"/>
      <circle cx="32" cy="11" r="2.3"/><circle cx="32" cy="53" r="2.3"/>
      <circle cx="11" cy="32" r="2.3"/><circle cx="53" cy="32" r="2.3"/>
    </g>
    <circle cx="32" cy="32" r="7" fill="#8ea6f2"/>
  </g>
  <text x="104" y="68" font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif"
        font-size="46" font-weight="700" letter-spacing="7" fill="#e8ebf7">POLARON</text>
</svg>
