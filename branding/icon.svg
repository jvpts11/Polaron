<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The Polaron app icon: the lattice knocked out of a solid brand tile. Used for the VS Code
       extension icon and rasterized into the Windows .ico.
       See logo.svg for what the mark is.

       A SOLID #395fdb GROUND rather than a dark one, deliberately. The dark tile the mascot sat on
       looked considered on this page and vanished into a dark taskbar, which is where an app icon
       spends its life -- next to a wall of other icons, at 32px, being found rather than admired.
       A saturated tile with the mark opened out of it is the version that gets found. -->
  <rect width="128" height="128" rx="28" fill="#395fdb"/>
  <g transform="translate(64,64) scale(1.45) translate(-32,-32)">
    <g fill="#c9d6fb">
      <circle cx="23.1" cy="23.1" r="3.1"/><circle cx="40.9" cy="23.1" r="3.1"/>
      <circle cx="23.1" cy="40.9" r="3.1"/><circle cx="40.9" cy="40.9" r="3.1"/>
      <circle cx="32" cy="11" r="2.3"/><circle cx="32" cy="53" r="2.3"/>
      <circle cx="11" cy="32" r="2.3"/><circle cx="53" cy="32" r="2.3"/>
    </g>
    <circle cx="32" cy="32" r="7" fill="#ffffff"/>
  </g>
</svg>
