<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The .pol file icon: a document sheet with the lattice. Legible at 16px. Dark-theme variant
       (light sheet outline); see file-icon-light.svg for light themes.

       THE FOUR THAT MOVED ARE THE FOUR THAT STAY. Inside a sheet outline at 16px there is room for
       five points and no more, so the reduction drops the outer ring -- the neighbours that did NOT
       move -- and keeps the core with the four pulled in toward it. That pairing is the mark; the
       outer ring is the sentence it completes when there is room for one. -->
  <path d="M7 3 h13 l5 5 v21 h-18 z" fill="none" stroke="#5f688c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M20 3 v5 h5" fill="none" stroke="#5f688c" stroke-width="2" stroke-linejoin="round"/>
  <g transform="translate(16,19) scale(0.155) translate(-32,-32)">
    <g fill="#5a80ec">
      <circle cx="20.5" cy="20.5" r="7"/><circle cx="43.5" cy="20.5" r="7"/>
      <circle cx="20.5" cy="43.5" r="7"/><circle cx="43.5" cy="43.5" r="7"/>
    </g>
    <circle cx="32" cy="32" r="12" fill="#8ea6f2"/>
  </g>
</svg>
