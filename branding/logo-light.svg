<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100">
  <!-- The Polaron horizontal logo, LIGHT-ground variant: the brand blue at full strength and near-
       black ink, so the wordmark keeps contrast on white. Use logo.svg on dark grounds.
       See logo.svg for what the mark is and why it is drawn this way. -->
  <g transform="translate(6,6) scale(1.375)">
    <g fill="#395fdb">
      <circle cx="23.1" cy="23.1" r="3.1"/><circle cx="40.9" cy="23.1" r="3.1"/>
      <circle cx="23.1" cy="40.9" r="3.1"/><circle cx="40.9" cy="40.9" r="3.1"/>
      <circle cx="32" cy="11" r="2.3"/><circle cx="32" cy="53" r="2.3"/>
      <circle cx="11" cy="32" r="2.3"/><circle cx="53" cy="32" r="2.3"/>
    </g>
    <circle cx="32" cy="32" r="7" fill="#1f3591"/>
  </g>
  <text x="104" y="68" font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif"
        font-size="46" font-weight="700" letter-spacing="7" fill="#13172a">POLARON</text>
</svg>
