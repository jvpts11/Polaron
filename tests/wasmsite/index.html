const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

WebAssembly.instantiate(bytes, {}).then(({ instance }) => {
  const x = instance.exports;
  x.kmain(0);                       // the module's own start: sets up the screen buffer
  x.click(41);                      // Polaron does the work
  x.click(1);
  // A string crosses as an offset and a length into the memory both sides share.
  const mem = new Uint8Array(x.memory.buffer);
  const ptr = x.textPtr(), len = x.textLen();
  const text = new TextDecoder().decode(mem.subarray(ptr, ptr + len));
  document.getElementById('out').textContent = text;
  document.getElementById('diag').textContent = 'ptr=' + ptr + ' len=' + len;
}).catch(e => {
  document.getElementById('out').textContent = 'FAILED: ' + e;
});
</script>
