<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The lattice, monochrome for the activity bar (VS Code recolors currentColor).
       This is the case the whole mark was designed for: one colour, no opacity, 24px. The rings are
       told apart by SIZE alone, so nothing is lost here that is present anywhere else -- see
       branding/logo.svg for what the mark is. -->
  <g fill="currentColor">
    <circle cx="8.66" cy="8.66" r="1.16"/><circle cx="15.34" cy="8.66" r="1.16"/>
    <circle cx="8.66" cy="15.34" r="1.16"/><circle cx="15.34" cy="15.34" r="1.16"/>
    <circle cx="12" cy="4.13" r="0.86"/><circle cx="12" cy="19.87" r="0.86"/>
    <circle cx="4.13" cy="12" r="0.86"/><circle cx="19.87" cy="12" r="0.86"/>
    <circle cx="12" cy="12" r="2.63"/>
  </g>
</svg>
